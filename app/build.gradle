plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.xiaobo.electronic'
    compileSdk 35

    defaultConfig {
        applicationId "com.xiaobo.electronic"
        minSdk 24
        targetSdk 35
        versionCode 1402
        versionName "1.4.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 本地 TTS 只打 arm64：省约 14MB。32 位老机本就跑不动神经网络推理，
        // 装上也会走系统音色降级，不如不让它装。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // onnx / fst / txt 必须保持未压缩：sherpa-onnx 直接映射文件内存，
    // 压缩过的资源拿不到连续内存，会静默加载失败（表现为一直降级到系统音色）。
    // zip 也保持原样：内置模型整包以 zip 存在 assets/models/，解压时直接读字节流，
    // 二次压缩只会白费 CPU，不会让包更小。
    androidResources {
        noCompress 'onnx', 'fst', 'txt', 'zip'
    }

    packagingOptions {
        // AAR 与依赖可能同时携带 libc++_shared.so，取其一即可
        pickFirst '**/libc++_shared.so'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.fireworksandroid
    implementation libs.activity
    implementation libs.mmkv
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation libs.balloon
    // 吐司框架：全局统一浪漫风格 Toast（替代系统原生黑块 Toast）
    implementation libs.toaster

    // 本地离线神经网络 TTS + ASR：sherpa-onnx（VITS 中文 + zipformer 流式识别）
    // 模型整包随 APK 内置在 assets/models/，首次使用时由 ModelInstaller 解压到 filesDir，
    // 全程不联网；详见 AsrModelStore / TtsModelStore
    implementation files('libs/sherpa-onnx-1.13.2.aar')
    implementation libs.kotlin.stdlib

    // 二维码生成（只编码不识别：扫码交给系统相机/微信，省掉相机权限与预览链路）
    implementation 'com.google.zxing:core:3.5.3'

}
